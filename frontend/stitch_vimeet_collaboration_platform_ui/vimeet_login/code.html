<!-- Brand Header -->
<div class="flex flex-col items-center mb-xl text-center">
<div class="w-12 h-12 bg-primary-container/10 rounded-xl flex items-center justify-center mb-md border border-primary/10">
<span class="material-symbols-outlined text-primary material-icon-filled" data-icon="videocam" style="font-size: 28px;">videocam</span>
</div>
<h1 class="font-headline-sm text-headline-sm text-primary mb-xs">ViMeet</h1>
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Welcome Back</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to securely access your workspace and upcoming meetings.</p>
</div>
<!-- Google SSO Button -->
<button class="w-full flex items-center justify-center gap-md bg-surface-container-lowest border border-outline-variant rounded-lg p-md hover:bg-surface-container-low hover:shadow-[0_2px_8px_rgba(0,0,0,0.04)] transition-all duration-200 group active:scale-[0.98]">

</button>

<div class="flex-grow h-px bg-surface-variant"></div>
<span class="px-md font-body-sm text-body-sm text-on-surface-variant">or continue with email</span>
<div class="flex-grow h-px bg-surface-variant"></div>
</div>
<!-- Email Form (Minimalist) -->
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Work Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline" data-icon="mail" style="font-size: 20px;">mail</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg py-[10px] pl-[44px] pr-md font-body-sm text-body-sm text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all duration-200" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline" data-icon="lock" style="font-size: 20px;">lock</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg py-[10px] pl-[44px] pr-md font-body-sm text-body-sm text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all duration-200" id="password" placeholder="••••••••" type="password"/>
</div>
